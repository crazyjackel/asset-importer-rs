name: Benchmarks

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  deployments: write

jobs:
  benchmark:
    name: Run Rust benchmark example
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        - name: Run benchmark
          run: cargo bench --benches -- --output-format bencher | tee output.txt
        - name: Store benchmark result
          uses: benchmark-action/github-action-benchmark@a60cea5bc7b49e15c1f58f411161f99e0df48372 # v1
          with:
            name: Rust Benchmark
            tool: 'cargo'
            output-file-path: output.txt
            github-token: ${{ secrets.GITHUB_TOKEN }}
            auto-push: true
            alert-threshold: '120%'
            comment-on-alert: true
            fail-on-alert: true
            alert-comment-cc-users: '@crazyjackel'        