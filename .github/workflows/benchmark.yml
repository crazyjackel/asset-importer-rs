name: Benchmarks

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  deployments: write

jobs:
  benchmark:
    name: Run Rust benchmark example
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        - name: Run benchmark
          run: cargo bench --benches -- --output-format bencher | tee output.txt
        - name: Store benchmark result
          uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
          with:
            name: Rust Benchmark
            tool: 'cargo'
            output-file-path: output.txt
            github-token: ${{ secrets.GITHUB_TOKEN }}
            auto-push: true
            alert-threshold: '120%'
            comment-on-alert: true
            fail-on-alert: true
            alert-comment-cc-users: '@crazyjackel'        