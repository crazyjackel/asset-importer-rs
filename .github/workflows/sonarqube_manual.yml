name: SonarQube (Manual)

# SONAR_TOKEN is unavailable to fork PRs and other untrusted events.
# Contributors with Actions write access can run this for a selected ref.
on:
  workflow_dispatch:
    inputs:
      coverage_run_id:
        description: >
          Optional Crate Tests workflow run ID whose coverage-* artifacts should
          be attached. Leave empty to scan without coverage reports.
        required: false
        type: string

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download coverage artifacts
        if: inputs.coverage_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage-artifacts/
          merge-multiple: false
          run-id: ${{ inputs.coverage_run_id }}
          github-token: ${{ github.token }}

      - name: Flatten coverage files
        run: |
          mkdir -p coverage
          if [ -d coverage-artifacts ] && [ "$(find coverage-artifacts -name "*.info" -type f | wc -l)" -gt 0 ]; then
            find coverage-artifacts -name "*.info" -type f -exec mv {} coverage/ \;
            find coverage-artifacts -type d -empty -delete
          else
            echo "No coverage artifacts found, creating empty coverage directory"
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
